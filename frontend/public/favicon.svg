<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="fav-grad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="55%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <!-- Background rounded plate for contrast in light/dark browser tabs -->
  <rect width="32" height="32" rx="7" fill="#050B14" />
  
  <!-- C-Lens Aperture Outer Ring -->
  <path
    d="M 22.5 7.8 A 12 12 0 1 0 22.5 24.2"
    stroke="url(#fav-grad)"
    stroke-width="2.8"
    stroke-linecap="round"
  />

  <!-- Inner Iris Ring -->
  <circle cx="14.5" cy="16" r="5" stroke="#00E5FF" stroke-width="1.2" opacity="0.85" />
  
  <!-- Central Focus Pupil -->
  <circle cx="14.5" cy="16" r="2.2" fill="#00E5FF" />
  <circle cx="14.5" cy="16" r="1" fill="#FFFFFF" />

  <!-- AI Sparkle Icon -->
  <path
    d="M 25 3 Q 25 7 29 7 Q 25 7 25 11 Q 25 7 21 7 Q 25 7 25 3 Z"
    fill="#00E5FF"
  />
</svg>