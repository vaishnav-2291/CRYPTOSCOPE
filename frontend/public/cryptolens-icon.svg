<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Cyan to Electric Blue to Violet gradient -->
    <linearGradient id="cl-gradient" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="52%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- AI Sparkle gradient -->
    <linearGradient id="cl-sparkle-grad" x1="42" y1="4" x2="60" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Glowing lens core -->
    <radialGradient id="cl-core-grad" cx="29" cy="32" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="85%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#050B14" />
    </radialGradient>

    <filter id="cl-lens-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Outer Futuristic C-Shaped Aperture Ring -->
  <path
    d="M 45 15.5 A 24 24 0 1 0 45 48.5"
    stroke="url(#cl-gradient)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Inner Cyber Aperture Ring with Precision Ticks -->
  <path
    d="M 40.5 21 A 17 17 0 1 0 40.5 43"
    stroke="url(#cl-gradient)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-dasharray="22 5 7 5"
    opacity="0.8"
  />

  <!-- Camera Target Reticle Guides -->
  <line x1="8" y1="32" x2="14" y2="32" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="29" y1="10" x2="29" y2="15" stroke="#3B82F6" stroke-width="2.2" stroke-linecap="round" opacity="0.75" />
  <line x1="29" y1="49" x2="29" y2="54" stroke="#8B5CF6" stroke-width="2.2" stroke-linecap="round" opacity="0.75" />

  <!-- Central Intelligent Lens / Focus Iris -->
  <circle cx="29" cy="32" r="7.5" fill="url(#cl-core-grad)" filter="url(#cl-lens-glow)" />
  <circle cx="29" cy="32" r="4.2" stroke="#00E5FF" stroke-width="1.2" fill="#0A1424" opacity="0.9" />
  <circle cx="29" cy="32" r="2" fill="#FFFFFF" />

  <!-- Distinctive AI Sparkle Accent at Upper Aperture Opening -->
  <path
    d="M 49 5 Q 49 13 57 13 Q 49 13 49 21 Q 49 13 41 13 Q 49 13 49 5 Z"
    fill="url(#cl-sparkle-grad)"
  />
  <circle cx="49" cy="13" r="1.5" fill="#FFFFFF" />
</svg>
